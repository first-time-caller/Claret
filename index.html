<title>Claret</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* Layout: one iPhone column. Large serif title, grouped lists, a frosted tab bar. Colour comes from the glass: every wine wears its tasting colour. */
:root{
  --bg:#F3F1F1;
  --cell:#FFFFFF;
  --ink:#1D1517;
  --ink2:#6C6064;
  --line:#E2DCDD;
  --accent:#6E1526;
  --accent-soft:#F3E4E6;
  --on-accent:#FFFFFF;
  --good:#2F6B4A;
  --warn:#9A5B13;
  --bad:#A3242E;
  --bar:rgba(247,245,245,.82);
  --scrim:rgba(20,10,12,.32);

  /* tasting colours */
  --c-water-white:#F2EED6; --c-lemon:#ECE08A; --c-straw:#E5CF78; --c-gold:#D6A944;
  --c-amber:#C47F31; --c-salmon:#EFA48E; --c-onion-skin:#D68E6A; --c-pink:#DE6C86;
  --c-purple:#4A1238; --c-ruby:#8C1530; --c-claret:#6E1526; --c-garnet:#7B2B2B;
  --c-tawny:#9A5A2E; --c-brick:#8A3B24;

  --serif:ui-serif,"New York","Newsreader",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","DM Mono",Menlo,monospace;
  --spring:cubic-bezier(.2,.9,.25,1.05);
  --ease:cubic-bezier(.22,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0A0B; --cell:#1B1517; --ink:#F3EDEE; --ink2:#A5989C; --line:#2E2629;
    --accent:#E27D8F; --accent-soft:#3A1B22; --on-accent:#1B0B0F;
    --good:#7CC59C; --warn:#E3A75C; --bad:#F07C84;
    --bar:rgba(22,17,19,.8); --scrim:rgba(0,0,0,.5);
    --c-water-white:#D9D4B8; --c-lemon:#D9CD72; --c-straw:#D6BE63; --c-gold:#D2A23E;
    --c-amber:#D08A3A; --c-salmon:#E8977F; --c-onion-skin:#D08A66; --c-pink:#E07890;
    --c-purple:#7A2358; --c-ruby:#B02A47; --c-claret:#A3304A; --c-garnet:#A54B3F;
    --c-tawny:#C27B46; --c-brick:#B35B3C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0A0B; --cell:#1B1517; --ink:#F3EDEE; --ink2:#A5989C; --line:#2E2629;
  --accent:#E27D8F; --accent-soft:#3A1B22; --on-accent:#1B0B0F;
  --good:#7CC59C; --warn:#E3A75C; --bad:#F07C84;
  --bar:rgba(22,17,19,.8); --scrim:rgba(0,0,0,.5);
  --c-water-white:#D9D4B8; --c-lemon:#D9CD72; --c-straw:#D6BE63; --c-gold:#D2A23E;
  --c-amber:#D08A3A; --c-salmon:#E8977F; --c-onion-skin:#D08A66; --c-pink:#E07890;
  --c-purple:#7A2358; --c-ruby:#B02A47; --c-claret:#A3304A; --c-garnet:#A54B3F;
  --c-tawny:#C27B46; --c-brick:#B35B3C;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{max-width:520px;margin-inline:auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* Large title */
.top{padding-block:14px 6px}
.moment{display:inline-flex;align-items:baseline;gap:6px;text-align:left;min-height:44px}
.moment[disabled]{cursor:default}
.moment svg{width:16px;height:16px;color:var(--accent);transform:translateY(-2px)}
.moment[disabled] svg{display:none}
h1{font:600 34px/1.1 var(--serif);letter-spacing:-.01em;margin:0}
.sub{margin:2px 0 0;color:var(--ink2);font-size:13px;letter-spacing:.02em}

.view{display:flex;flex-direction:column;gap:22px;padding-top:12px;animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Section headers, iOS grouped style */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-inline:4px}
.sec-h h2{margin:0;font:500 13px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.link{color:var(--accent);font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.group{background:var(--cell);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row.has-glass+.row::before,.row.has-glass+.row.has-glass::before{left:64px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-t{font:500 17px/1.25 var(--serif);overflow-wrap:anywhere}
.row-s{font-size:14px;color:var(--ink2);overflow-wrap:anywhere}
.row-end{color:var(--ink2);font-size:15px;flex:none;text-align:right}
.chev{width:8px;height:14px;color:var(--ink2);opacity:.5;flex:none}
.foot{font-size:13px;color:var(--ink2);padding-inline:4px;margin:0}

/* Glass swatch: looking down into a tilted glass, deep core and a paler rim */
.glass{--c:var(--c-claret);width:36px;height:36px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 46% 44%,var(--c) 0 50%,color-mix(in oklab,var(--c) 62%,var(--cell)) 78%,color-mix(in oklab,var(--c) 26%,var(--cell)) 100%);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ink) 10%,transparent)}
.glass.lg{width:64px;height:64px}
.glass.sparkle{background:radial-gradient(circle at 34% 36%,rgba(255,255,255,.7) 0 2px,transparent 3px),radial-gradient(circle at 62% 58%,rgba(255,255,255,.6) 0 1.5px,transparent 2.5px),radial-gradient(circle at 52% 30%,rgba(255,255,255,.55) 0 1px,transparent 2px),radial-gradient(circle at 46% 44%,var(--c) 0 50%,color-mix(in oklab,var(--c) 62%,var(--cell)) 78%,color-mix(in oklab,var(--c) 26%,var(--cell)) 100%)}

/* Controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in oklab,var(--ink) 7%,var(--bg));border-radius:10px;padding:2px;gap:2px}
.seg button{min-height:36px;border-radius:8px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);transition:background .2s,color .2s}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--cell);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
#moods{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
#moods::-webkit-scrollbar{display:none}
#moods .chip{flex:none}
.chip{min-height:36px;padding:6px 14px;border-radius:999px;background:var(--cell);font-size:15px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.static{cursor:default;background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chip .x{opacity:.6}
.btn{min-height:50px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .15s var(--spring),opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--cell);color:var(--accent)}
.btn svg{width:20px;height:20px}
.btns{display:flex;gap:10px}
.btns>*{flex:1}
.input{width:100%;min-height:44px;border:0;background:transparent;padding:0;font-size:17px;outline:none}
.input::placeholder,textarea::placeholder{color:color-mix(in oklab,var(--ink2) 85%,transparent)}
textarea.input{min-height:88px;resize:vertical;line-height:1.4;padding-block:4px}
.lab{font-size:15px;color:var(--ink);flex:none;min-width:88px}
.row input[type=number]{text-align:right;width:96px}
select.input{appearance:none;-webkit-appearance:none;text-align:right;width:auto;max-width:60%;color:var(--ink2)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:44px}
.toggle{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:color-mix(in oklab,var(--ink) 16%,var(--bg));position:relative;flex:none;transition:background .25s;cursor:pointer}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.toggle:checked{background:var(--good)}
.toggle:checked::after{transform:translateX(20px)}

/* Tonight */
.pick{background:var(--cell);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.pick-head{display:flex;gap:16px;align-items:center}
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.pick h3{font:600 26px/1.15 var(--serif);margin:4px 0 0;text-wrap:balance}
.why{margin:0;font-size:16px;line-height:1.45}
.look{margin:0;font:400 17px/1.45 var(--serif);color:var(--ink)}
.look b{font-weight:500}
.serve{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:14px}
.serve div{display:flex;flex-direction:column;gap:2px;min-width:0}
.serve .k{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.serve .v{font:400 14px/1.3 var(--mono);overflow-wrap:anywhere}
.bottle{display:flex;flex-direction:column;gap:4px}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;align-self:flex-start}
.verdict.good{color:var(--good);background:color-mix(in oklab,var(--good) 14%,transparent)}
.verdict.maybe{color:var(--warn);background:color-mix(in oklab,var(--warn) 14%,transparent)}
.verdict.bad{color:var(--bad);background:color-mix(in oklab,var(--bad) 14%,transparent)}
.flag{font-size:13px;color:var(--bad)}
.status{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:15px;padding:4px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{background:var(--cell);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:8px;text-align:left}
.empty h3{margin:0;font:600 20px/1.2 var(--serif)}
.empty p{margin:0;color:var(--ink2);font-size:15px}

/* Scan */
.shutter{display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;border-radius:20px;background:var(--cell);border:1.5px dashed color-mix(in oklab,var(--accent) 45%,var(--line));color:var(--accent);font-weight:600;font-size:17px;cursor:pointer;position:relative}
.shutter svg{width:28px;height:28px}
.shutter input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:96px;border-radius:10px;object-fit:cover;background:var(--line)}
.thumb-wrap{position:relative}
.thumb-x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:15px;line-height:26px;text-align:center}
.picked{outline:2px solid var(--accent);outline-offset:-2px}
.tag-pick{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* Log */
.stars{display:inline-flex;gap:2px;color:var(--accent);font-size:13px;letter-spacing:1px}
.swatches{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px 6px;padding:14px 12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--ink2);min-height:44px}
.sw .glass{width:32px;height:32px;transition:transform .2s var(--spring)}
.sw[aria-checked="true"] .glass{transform:scale(1.15);box-shadow:0 0 0 2px var(--cell),0 0 0 4px var(--accent)}
.sw[aria-checked="true"]{color:var(--ink)}
.rate{display:flex;gap:6px;color:var(--accent)}
.rate button{width:40px;height:44px;display:flex;align-items:center;justify-content:center}
.rate svg{width:28px;height:28px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:1;max-width:220px}
.scale button{height:30px;border-radius:7px;background:color-mix(in oklab,var(--ink) 7%,var(--bg));font-size:13px;color:var(--ink2)}
.scale button[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.month-h{font:600 20px/1.2 var(--serif);margin:6px 4px 0}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--cell);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat .n{font:600 28px/1 var(--serif)}
.stat .l{font-size:13px;color:var(--ink2)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-inner{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabpill .tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;font-size:11px;font-weight:500;color:var(--ink2);transition:color .2s}
.tabpill .tab svg{width:26px;height:26px}
.tabpill .tab[aria-current="page"]{color:var(--accent)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .25s var(--ease)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .4s var(--spring);display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.grabber{width:36px;height:5px;border-radius:3px;background:color-mix(in oklab,var(--ink) 20%,transparent);margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--bg);z-index:1;padding-block:4px}
.sheet-h h2{margin:0;font:600 20px var(--serif)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.unsynced{color:var(--warn)}


/* ===== The Glass: hero photo fading into the wine's colour ===== */
.top.hide{display:none}
.hero{--wine:var(--c-garnet);--hc:#fff;position:relative;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));color:var(--hc);
  background:linear-gradient(180deg,transparent 78%,var(--bg) 99%),radial-gradient(ellipse 130% 70% at 50% 78%,color-mix(in oklab,var(--wine) 80%,#000) 0 26%,var(--wine) 46%,color-mix(in oklab,var(--wine) 55%,var(--bg)) 72%,var(--bg) 96%)}
.hero-img{position:absolute;inset:0 0 auto;width:100%;height:58%;object-fit:cover;transition:opacity .6s var(--ease)}
.hero-img[data-loading]{opacity:0}
.hero-wash{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.28) 0,transparent 18%,transparent 30%,color-mix(in oklab,var(--wine) 70%,transparent) 50%,color-mix(in oklab,var(--wine) 92%,#000) 62%,transparent 63%)}
.hero.noimg .hero-wash{display:none}
.hero-in{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;padding:0 max(20px,env(safe-area-inset-right,0px)) 116px max(20px,env(safe-area-inset-left,0px))}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;min-height:36px;color:inherit;align-self:flex-start;opacity:.92}
.hero-eyebrow svg{width:12px;height:12px}
.hero-title{font:500 44px/1.03 var(--serif);letter-spacing:-.02em;margin:0;text-wrap:balance}
.hero-why{font:400 17px/1.4 var(--sans);margin:0;max-width:34ch;opacity:.9}
.ctx-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.gchip{min-height:36px;border-radius:18px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font:500 15px var(--sans);color:inherit;
  background:color-mix(in oklab,var(--hc) 15%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 .5px color-mix(in oklab,var(--hc) 32%,transparent)}
.gchip svg{width:15px;height:15px}
.credit{position:absolute;z-index:3;left:max(16px,env(safe-area-inset-left,0px));top:12px;font:500 10px var(--mono);letter-spacing:.04em;color:#fff;background:rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:5px 10px;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:24px}
.region-name{position:absolute;z-index:3;left:max(20px,env(safe-area-inset-left,0px));top:12px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4)}
@media (min-width:560px){.hero{margin-inline:0;border-radius:32px}}

/* Liquid Glass material */
.lgm{background:color-mix(in oklab,var(--cell) 72%,transparent);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:inset 0 1px 0 color-mix(in oklab,#fff 60%,transparent),inset 0 0 0 .5px color-mix(in oklab,var(--ink) 10%,transparent),0 10px 34px rgba(0,0,0,.14)}
.look-card{position:relative;z-index:4;margin-top:-92px;border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:14px}
.look-top{display:flex;gap:14px;align-items:flex-start}
.bottle{width:34px;height:96px;flex:none}
.look-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.look-list{font:400 19px/1.35 var(--serif);margin:0}
.pillbtns{display:flex;gap:10px}
.pillbtns .btn{border-radius:999px;min-height:50px}

/* Where it's from */
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;padding-block:2px 6px}
.strip::-webkit-scrollbar{display:none}
.place{flex:none;width:232px;height:300px;border-radius:24px;overflow:hidden;position:relative;scroll-snap-align:start;color:#fff;text-align:left;background:var(--line)}
.place img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.place::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72))}
.place-in{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;display:flex;flex-direction:column;gap:4px}

const LOCAL_KEY = 'claret.v1';
function defaultProfile() {
  return { schema: SCHEMA, home: { country: 'uk', city: 'London', hemisphere: 'north', cur: 'GBP' },
    moments: { tonightFrom: '16:30', nightcapFrom: '22:30' }, limits: [], prefs: [], explore: 0.5, updatedAt: null };

const Store = {
  mode: 'local', db: null, uid: null, unsynced: false,
  profile: defaultProfile(), nodes: new Map(), months: new Map(), queue: new Map(),
  loadLocal() {
    const d = LS.get(LOCAL_KEY, null);
    if (!d) return;
    if (d.profile) this.profile = migrateProfile(d.profile);
    for (const n of d.nodes || []) this.nodes.set(n.id, n);
    for (const m of d.months || []) this.months.set(m.month, m);
  },
  saveLocal() {
    const ok = LS.set(LOCAL_KEY, { profile: this.profile, nodes: [...this.nodes.values()], months: [...this.months.values()] });
    if (!ok && this.mode === 'local') toast('Couldn’t save on this device. Export your data to keep it.');
  },
  async connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) return;
      const base = 'data/users/' + uid;
      const profRef = db.doc(base + '/profile');
      const storeRef = db.doc(base + '/store');
      const [prof, nodes, months] = await Promise.all([profRef.get(), storeRef.collection('nodes').limit(1000).get(), storeRef.collection('events').limit(1000).get()]);
      this.db = db; this.uid = uid; this.mode = 'db';
      this.refs = { profRef, storeRef };
      if (prof.exists) {
        this.profile = migrateProfile(structuredClone(prof.data()));
        this.nodes = new Map(); this.months = new Map();
        for (const d of nodes.docs) { const n = structuredClone(d.data()); if (n && n.id) this.nodes.set(n.id, n); }
        for (const d of months.docs) { const m = structuredClone(d.data()); if (m && m.month) this.months.set(m.month, m); }
        this.saveLocal();
      } else {
        // First visit with sync: upload whatever this device already holds.
        this.write('profile', () => profRef.set(this.profile));
        for (const n of this.nodes.values()) this.saveNode(n);
        for (const k of this.months.keys()) this.saveMonth(k);
      }
      seedCatalogue();
      for (const n of this.nodes.values()) indexAlias(n.id, [n.name, ...(n.aliases || [])]);
      renderAll();
    } catch (e) { /* stay local */ }
  },
  write(path, fn) {
    if (this.mode !== 'db') return Promise.resolve();
    const prev = this.queue.get(path) || Promise.resolve();
    const p = prev.then(fn).then(() => { if (this.unsynced) { this.unsynced = false; renderSync(); } })
      .catch(e => { this.unsynced = true; renderSync(); if (e && e.code === 'quota_exceeded') toast('Your Claret storage is full. Export your data, then remove old months.'); });
    this.queue.set(path, p);
    return p;
  },
  saveProfile() {
    this.profile.updatedAt = new Date().toISOString();
    this.saveLocal();
    this.write('profile', () => this.refs.profRef.set(this.profile));
  },
  saveNode(n) {
    this.nodes.set(n.id, n); this.saveLocal();
    indexAlias(n.id, [n.name, ...(n.aliases || [])]);
    const docId = n.id.replace(/\//g, '~');
    this.write('n/' + docId, () => this.refs.storeRef.collection('nodes').doc(docId).set(n));
  },
  saveMonth(key) {
    const m = this.months.get(key); this.saveLocal();
    if (!m) return;
    this.write('e/' + key, () => this.refs.storeRef.collection('events').doc(key).set(m));
  },
  addEvent(ev) {
    ev.id = ev.id || 'evt:' + ulid();
    ev.at = ev.at || new Date().toISOString();
    const key = monthKey(new Date(ev.at));
    let m = this.months.get(key);
    if (!m) { m = { schema: SCHEMA, month: key, items: [] }; this.months.set(key, m); }

  },
  updateEvent(id, patch) {
    for (const [key, m] of this.months) {

      if (ev) { Object.assign(ev, patch); this.saveMonth(key); return ev; }

  },
  events(kind) {
    const out = [];

   Tonight: a local style engine that works with no network.
   Claude is asked only for bottles.
   ============================================================ */
function scoreStyles() {
  const c = ctxSnapshot();
  const col = lim('colour');
  const P = palate();
  const food = fold(c.food);
  const recentStyles = new Set(Store.events('tasting').slice(0, 6).map(t => { const d = describeVintage(t.node); return d.wine.links && d.wine.links.style; }).filter(Boolean));
  const explore = Store.profile.explore ?? 0.5;
  const out = [];
  for (const s of STYLES) {
    if (col && !col.value.includes(s.fam)) continue;
    let score = 0; const why = [];
    const add = (k, label) => { const v = s.w[k] || 0; if (v) { score += v; if (v >= 2 && label) why.push(label); } };
    add(c.moment, { today: 'easy for the daytime', lunch: 'made for a long lunch', tonight: 'right for the evening', nightcap: 'a proper nightcap' }[c.moment]);
    add(c.season, 'suits ' + c.season);
    if (c.weather) add(c.weather, { warm: 'refreshing in the warmth', mild: 'easy in mild weather', 'cold-wet': 'warming on a cold, wet day' }[c.weather]);
    if (c.mood) add(c.mood, { easy: 'easy-going', comforting: 'comforting', celebrating: 'feels like an occasion', curious: 'something different' }[c.mood]);
    if (food) {
      const hit = s.food.find(f => food.includes(fold(f)));

    }
    const fp = P.fam[s.fam];

    const sp = P.style[s.id];

    else if (explore > 0.6 && !sp) { score += (explore - 0.5) * 3; if (explore >= 0.8) why.push('new ground for you'); }

}

numInput('#limAbv', v => { const n = num(v); setLim('abv', 'max', n && n > 0 ? n : null); });
$('#limGrapeIn').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; e.preventDefault();
  const v = e.target.value.trim(); if (!v) return;
  const id = resolveGrape(v) || 'grape:' + slug(v);
  const gr = lim('grape'); const curv = gr ? gr.value.slice() : [];
  if (!curv.includes(id)) setLim('grape', 'not-in', [...curv, id]);
  e.target.value = ''; renderAll();
});
$('#explore').addEventListener('change', e => { Store.profile.explore = +e.target.value; Store.saveProfile(); S.pick = null; renderAll(); });
$('#city').addEventListener('change', e => { Store.profile.home.city = e.target.value.trim(); Store.saveProfile(); renderHeader(); });
$('#tonightFrom').addEventListener('change', e => { if (e.target.value) { Store.profile.moments.tonightFrom = e.target.value; Store.saveProfile(); renderAll(); } });
$('#nightcapFrom').addEventListener('change', e => { if (e.target.value) { Store.profile.moments.nightcapFrom = e.target.value; Store.saveProfile(); renderAll(); } });
$('#exportBtn').addEventListener('click', async () => {
  const data = JSON.stringify({ app: 'claret', schema: SCHEMA, atlas: ATLAS_VERSION, exportedAt: new Date().toISOString(), profile: Store.profile, nodes: [...Store.nodes.values()], months: [...Store.months.values()] }, null, 1);
  const name = 'claret-' + new Date().toISOString().slice(0, 10) + '.json';
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) { try { await dl.save({ filename: name, data }); toast('Saved ' + name); return; } catch (e) { /* fall through to copy */ } }
  const out = $('#exportOut'); out.hidden = false; out.value = data; out.select();
  try { await navigator.clipboard.writeText(data); toast('Copied your data'); } catch (e) { toast('Select the text below and copy it.'); }
});

/* ============================================================
   Shell: header, tabs, moment switch
   ============================================================ */
const TAB_TITLE = { scan: 'Scan', log: 'Log', you: 'You', explore: 'Explore', wine: '' };
function renderHeader() {
  const m = moment();
  const d = new Date();
  $('.top').classList.toggle('hide', S.tab === 'tonight' || S.tab === 'wine');
  $('#title').textContent = TAB_TITLE[S.tab] || '';
  $('#tabMoment').textContent = MOMENT_NAME[m] === 'This afternoon' ? 'Today' : MOMENT_NAME[m];
  const s = season(d);
  $('#sub').textContent = [d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }), pad(d.getHours()) + ':' + pad(d.getMinutes()), s[0].toUpperCase() + s.slice(1), Store.profile.home.city].filter(Boolean).join(' · ');
}
function go(tab, focusSel) {
  S.tab = tab;
  for (const v of ['tonight', 'explore', 'wine', 'scan', 'log', 'you']) $('#v-' + v).hidden = v !== tab;
  const lit = tab === 'wine' ? S.prevTab : tab;
  $$('.tab').forEach(b => { if (b.dataset.tab === lit) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  renderAll();
  window.scrollTo(0, 0);
  if (focusSel) setTimeout(() => { const n = $(focusSel); n && n.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 50);
}
function renderAll() {
  renderHeader();
  if (S.tab === 'tonight') renderTonight();
  if (S.tab === 'scan') renderScan();
  if (S.tab === 'log') renderLog();
  if (S.tab === 'explore') renderExplore();
  if (S.tab === 'wine') renderWine();
  if (S.tab === 'you') renderYou();
}
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

$$('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });
$('#momentBtn').addEventListener('click', () => {
  const auto = autoMoment();
  openSheet('What are we drinking for?', [el('div', { class: 'group' }, ...Object.entries(MOMENT_NAME).map(([k, n]) =>
    el('button', { class: 'row', type: 'button', onclick: () => { S.momentOverride = k === auto ? null : k; S.pick = null; $('#bottles').replaceChildren(); closeSheet(); renderAll(); } },
      el('span', { class: 'row-main' }, el('span', { class: 'row-t', text: n }), k === auto ? el('span', { class: 'row-s', text: 'Right now' }) : null),
      moment() === k ? el('span', { class: 'row-end', style: 'color:var(--accent)', text: '✓' }) : null))),
  el('p', { class: 'foot', text: 'Claret switches from Today to Tonight at ' + Store.profile.moments.tonightFrom + '. Change the times in You.' })]);
});
$('#findBtn').addEventListener('click', findBottles);
$('#addLog').addEventListener('click', () => openLog());
$('#timerStop').addEventListener('click', () => Timer.stop());
$('#scanMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.scan.mode = b.dataset.m; $('#photo').toggleAttribute('multiple', b.dataset.m !== 'label'); $('#scanOut').replaceChildren(); renderScan(); });
$('#photo').addEventListener('change', e => { for (const f of e.target.files) S.scan.files.push({ blob: f }); e.target.value = ''; $('#scanOut').replaceChildren(); renderScan(); });
$('#readBtn').addEventListener('click', readScan);
let qT = null; $('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(renderExplore, 150); });
$('#stopBtn').addEventListener('click', () => { S.scan.ctl && S.scan.ctl.abort(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderHeader(); });
let lastMoment = moment();
setInterval(() => { if (!document.hidden) { renderHeader(); if (S.tab === 'tonight' && moment() !== lastMoment) { lastMoment = moment(); S.pick = null; renderTonight(); } } }, 60000);

/* Boot: render from this device at once, then connect sync */
Store.loadLocal();
function seedCatalogue() { for (const n of CATALOGUE) if (!Store.nodes.has(n.id)) Store.nodes.set(n.id, structuredClone(n)); }
seedCatalogue();
for (const n of Store.nodes.values()) indexAlias(n.id, [n.name, ...(n.aliases || [])]);
renderAll();
Timer.tick();
Store.connect();
</script>
