<title>Claret</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Great+Vibes&family=IM+Fell+English+SC&family=Abril+Fatface&family=Cinzel:wght@500&family=Cinzel+Decorative:wght@700&family=Marcellus&family=Italianno&family=UnifrakturMaguntia&family=Dancing+Script:wght@500&family=Limelight&family=Josefin+Sans:wght@300&family=Noto+Serif+Georgian:wght@400&family=Italiana&family=DM+Serif+Display&family=Cormorant+SC:wght@500&family=Bodoni+Moda:wght@500&family=Playfair+Display+SC:wght@400&family=Poiret+One&family=Jost:wght@300&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Layout: one iPhone column. Large serif title, grouped lists, a frosted tab bar. Colour comes from the glass: every wine wears its tasting colour. */
:root{
  --bg:#F3F1F1;
  --cell:#FFFFFF;
  --ink:#1D1517;
  --ink2:#6C6064;
  --line:#E2DCDD;
  --accent:#6E1526;
  --accent-soft:#F3E4E6;
  --on-accent:#FFFFFF;
  --good:#2F6B4A;
  --warn:#9A5B13;
  --bad:#A3242E;
  --bar:rgba(247,245,245,.82);
  --scrim:rgba(20,10,12,.32);
  --pour-a:#4E0C1A; --pour-b:#8A2236;

  /* tasting colours */
  --c-water-white:#F2EED6; --c-lemon:#ECE08A; --c-straw:#E5CF78; --c-gold:#D6A944;
  --c-amber:#C47F31; --c-salmon:#EFA48E; --c-onion-skin:#D68E6A; --c-pink:#DE6C86;
  --c-purple:#4A1238; --c-ruby:#8C1530; --c-claret:#6E1526; --c-garnet:#7B2B2B;
  --c-tawny:#9A5A2E; --c-brick:#8A3B24;

  --serif:ui-serif,"New York","Newsreader",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-serif,"New York","Newsreader",Georgia,serif;
  --spring:cubic-bezier(.2,.9,.25,1.05);
  --ease:cubic-bezier(.22,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0A0B; --cell:#1B1517; --ink:#F3EDEE; --ink2:#A5989C; --line:#2E2629;
    --accent:#E27D8F; --accent-soft:#3A1B22; --on-accent:#1B0B0F;
    --good:#7CC59C; --warn:#E3A75C; --bad:#F07C84;
    --bar:rgba(22,17,19,.8); --scrim:rgba(0,0,0,.5);
    --pour-a:#A3304A; --pour-b:#DA6A80;
    --c-water-white:#D9D4B8; --c-lemon:#D9CD72; --c-straw:#D6BE63; --c-gold:#D2A23E;
    --c-amber:#D08A3A; --c-salmon:#E8977F; --c-onion-skin:#D08A66; --c-pink:#E07890;
    --c-purple:#7A2358; --c-ruby:#B02A47; --c-claret:#A3304A; --c-garnet:#A54B3F;
    --c-tawny:#C27B46; --c-brick:#B35B3C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0A0B; --cell:#1B1517; --ink:#F3EDEE; --ink2:#A5989C; --line:#2E2629;
  --accent:#E27D8F; --accent-soft:#3A1B22; --on-accent:#1B0B0F;
  --good:#7CC59C; --warn:#E3A75C; --bad:#F07C84;
  --bar:rgba(22,17,19,.8); --scrim:rgba(0,0,0,.5);
  --pour-a:#A3304A; --pour-b:#DA6A80;
  --c-water-white:#D9D4B8; --c-lemon:#D9CD72; --c-straw:#D6BE63; --c-gold:#D2A23E;
  --c-amber:#D08A3A; --c-salmon:#E8977F; --c-onion-skin:#D08A66; --c-pink:#E07890;
  --c-purple:#7A2358; --c-ruby:#B02A47; --c-claret:#A3304A; --c-garnet:#A54B3F;
  --c-tawny:#C27B46; --c-brick:#B35B3C;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:lining-nums tabular-nums}

.shell{max-width:520px;margin-inline:auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* Large title */
.top{padding-block:14px 6px}
.moment{display:inline-flex;align-items:baseline;gap:6px;text-align:left;min-height:44px}
.moment[disabled]{cursor:default}
.moment svg{width:16px;height:16px;color:var(--accent);transform:translateY(-2px)}
.moment[disabled] svg{display:none}
h1{font:600 34px/1.1 var(--serif);letter-spacing:-.01em;margin:0}
.sub{margin:2px 0 0;color:var(--ink2);font-size:13px;letter-spacing:.02em}

.view{display:flex;flex-direction:column;gap:22px;padding-top:12px;animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Section headers, iOS grouped style */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-inline:4px}
.sec-h h2{margin:0;font:500 13px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.link{color:var(--accent);font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.group{background:var(--cell);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row.has-glass+.row::before,.row.has-glass+.row.has-glass::before{left:64px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-t{font:500 17px/1.25 var(--serif);overflow-wrap:anywhere}
.row-s{font-size:14px;color:var(--ink2);overflow-wrap:anywhere}
.row-end{color:var(--ink2);font-size:15px;flex:none;text-align:right}
.chev{width:8px;height:14px;color:var(--ink2);opacity:.5;flex:none}
.foot{font-size:13px;color:var(--ink2);padding-inline:4px;margin:0}

/* Glass swatch: looking down into a tilted glass, deep core and a paler rim */
.glass{--c:var(--c-claret);width:36px;height:36px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 46% 44%,var(--c) 0 50%,color-mix(in oklab,var(--c) 62%,var(--cell)) 78%,color-mix(in oklab,var(--c) 26%,var(--cell)) 100%);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ink) 10%,transparent)}
.glass.lg{width:64px;height:64px}
.glass.sparkle{background:radial-gradient(circle at 34% 36%,rgba(255,255,255,.7) 0 2px,transparent 3px),radial-gradient(circle at 62% 58%,rgba(255,255,255,.6) 0 1.5px,transparent 2.5px),radial-gradient(circle at 52% 30%,rgba(255,255,255,.55) 0 1px,transparent 2px),radial-gradient(circle at 46% 44%,var(--c) 0 50%,color-mix(in oklab,var(--c) 62%,var(--cell)) 78%,color-mix(in oklab,var(--c) 26%,var(--cell)) 100%)}

/* Controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in oklab,var(--ink) 7%,var(--bg));border-radius:10px;padding:2px;gap:2px}
.seg button{min-height:36px;border-radius:8px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);transition:background .2s,color .2s}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--cell);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
#moods{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
#moods::-webkit-scrollbar{display:none}
#moods .chip{flex:none}
.chip{min-height:36px;padding:6px 14px;border-radius:999px;background:var(--cell);font-size:15px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.static{cursor:default;background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chip .x{opacity:.6}
.btn{min-height:50px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .15s var(--spring),opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--cell);color:var(--accent)}
.btn svg{width:20px;height:20px}
.btns{display:flex;gap:10px}
.btns>*{flex:1}
.input{width:100%;min-height:44px;border:0;background:transparent;padding:0;font-size:17px;outline:none}
.input::placeholder,textarea::placeholder{color:color-mix(in oklab,var(--ink2) 85%,transparent)}
textarea.input{min-height:88px;resize:vertical;line-height:1.4;padding-block:4px}
.lab{font-size:15px;color:var(--ink);flex:none;min-width:88px}
.row input[type=number]{text-align:right;width:96px}
select.input{appearance:none;-webkit-appearance:none;text-align:right;width:auto;max-width:60%;color:var(--ink2)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:44px}
.toggle{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:color-mix(in oklab,var(--ink) 16%,var(--bg));position:relative;flex:none;transition:background .25s;cursor:pointer}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.toggle:checked{background:var(--good)}
.toggle:checked::after{transform:translateX(20px)}

/* Tonight */
.pick{background:var(--cell);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.pick-head{display:flex;gap:16px;align-items:center}
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.pick h3{font:600 26px/1.15 var(--serif);margin:4px 0 0;text-wrap:balance}
.why{margin:0;font-size:16px;line-height:1.45}
.look{margin:0;font:400 17px/1.45 var(--serif);color:var(--ink)}
.look b{font-weight:500}
.serve{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:14px}
.serve div{display:flex;flex-direction:column;gap:2px;min-width:0}
.serve .k{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.serve .v{font:400 16px/1.3 var(--serif);font-variant-numeric:lining-nums}
.bottle{display:flex;flex-direction:column;gap:4px}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;align-self:flex-start}
.verdict.good{color:var(--good);background:color-mix(in oklab,var(--good) 14%,transparent)}
.verdict.maybe{color:var(--warn);background:color-mix(in oklab,var(--warn) 14%,transparent)}
.verdict.bad{color:var(--bad);background:color-mix(in oklab,var(--bad) 14%,transparent)}
.flag{font-size:13px;color:var(--bad)}
.status{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:15px;padding:4px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{background:var(--cell);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:8px;text-align:left}
.empty h3{margin:0;font:600 20px/1.2 var(--serif)}
.empty p{margin:0;color:var(--ink2);font-size:15px}

/* Scan */
.shutter{display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;border-radius:20px;background:var(--cell);border:1.5px dashed color-mix(in oklab,var(--accent) 45%,var(--line));color:var(--accent);font-weight:600;font-size:17px;cursor:pointer;position:relative}
.shutter svg{width:28px;height:28px}
.shutter input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:96px;border-radius:10px;object-fit:cover;background:var(--line)}
.thumb-wrap{position:relative}
.thumb-x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:15px;line-height:26px;text-align:center}
.picked{outline:2px solid var(--accent);outline-offset:-2px}
.tag-pick{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* Log */
.stars{display:inline-flex;gap:2px;color:var(--accent);font-size:13px;letter-spacing:1px}
.swatches{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px 6px;padding:14px 12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--ink2);min-height:44px}
.sw .glass{width:32px;height:32px;transition:transform .2s var(--spring)}
.sw[aria-checked="true"] .glass{transform:scale(1.15);box-shadow:0 0 0 2px var(--cell),0 0 0 4px var(--accent)}
.sw[aria-checked="true"]{color:var(--ink)}
.rate{display:flex;gap:6px;color:var(--accent)}
.rate button{width:40px;height:44px;display:flex;align-items:center;justify-content:center}
.rate svg{width:28px;height:28px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:1;max-width:220px}
.scale button{height:30px;border-radius:7px;background:color-mix(in oklab,var(--ink) 7%,var(--bg));font-size:13px;color:var(--ink2)}
.scale button[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.month-h{font:600 20px/1.2 var(--serif);margin:6px 4px 0}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--cell);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat .n{font:600 28px/1 var(--serif)}
.stat .l{font-size:13px;color:var(--ink2)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-inner{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabpill .tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;font-size:11px;font-weight:500;color:var(--ink2);transition:color .2s}
.tabpill .tab svg{width:26px;height:26px}
.tabpill .tab[aria-current="page"]{color:var(--accent)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .25s var(--ease)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .4s var(--spring);display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.grabber{width:36px;height:5px;border-radius:3px;background:color-mix(in oklab,var(--ink) 20%,transparent);margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--bg);z-index:1;padding-block:4px}
.sheet-h h2{margin:0;font:600 20px var(--serif)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.unsynced{color:var(--warn)}


/* ===== The Glass: hero photo fading into the wine's colour ===== */
.top.hide{display:none}
.hero{--wine:var(--c-garnet);--hc:#fff;position:relative;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));color:var(--hc);
  background:linear-gradient(180deg,transparent 78%,var(--bg) 99%),radial-gradient(ellipse 130% 70% at 50% 78%,color-mix(in oklab,var(--wine) 80%,#000) 0 26%,var(--wine) 46%,color-mix(in oklab,var(--wine) 55%,var(--bg)) 72%,var(--bg) 96%)}
.hero-img{position:absolute;inset:0 0 auto;width:100%;height:58%;object-fit:cover;transition:opacity .6s var(--ease)}
.hero-img[data-loading]{opacity:0}
.hero-wash{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.28) 0,transparent 18%,transparent 30%,color-mix(in oklab,var(--wine) 70%,transparent) 50%,color-mix(in oklab,var(--wine) 92%,#000) 62%,transparent 63%)}
.hero.noimg .hero-wash{display:none}
.hero-in{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;padding:0 max(20px,env(safe-area-inset-right,0px)) 116px max(20px,env(safe-area-inset-left,0px))}
.hero-date{position:absolute;z-index:4;top:14px;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));text-align:left;color:inherit;font:500 15px/1.3 var(--sans);min-height:44px;display:flex;align-items:center;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.hero.noimg .hero-date,.hero[style*="--hc:#241A10"] .hero-date{text-shadow:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;min-height:36px;color:inherit;align-self:flex-start;opacity:.92}
.hero-eyebrow svg{width:12px;height:12px}
.hero-title{font:500 clamp(34px,10.5vw,44px)/1.04 var(--serif);letter-spacing:-.02em;margin:0;text-wrap:balance;hyphens:manual;-webkit-hyphens:manual;overflow-wrap:normal;word-break:normal}
.w{white-space:nowrap}
.hero-why{font:400 17px/1.4 var(--sans);margin:0;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.gchip{min-height:36px;border-radius:18px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font:500 15px var(--sans);color:inherit;
  background:color-mix(in oklab,var(--hc) 15%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 .5px color-mix(in oklab,var(--hc) 32%,transparent)}
.gchip svg{width:15px;height:15px}
.credit{position:absolute;z-index:1;inset:0 0 auto;height:52%;background:none;border-radius:0;padding:0;min-height:0;-webkit-backdrop-filter:none;backdrop-filter:none;cursor:zoom-in}
.credit-old{position:absolute;z-index:3;left:max(16px,env(safe-area-inset-left,0px));top:12px;font:500 10px var(--mono);letter-spacing:.04em;color:#fff;background:rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:5px 10px;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:24px}
.region-name{position:absolute;z-index:3;left:max(20px,env(safe-area-inset-left,0px));top:12px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4)}
@media (min-width:560px){.hero{margin-inline:0;border-radius:32px}}

/* Liquid Glass material */
.lgm{background:color-mix(in oklab,var(--cell) 72%,transparent);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:inset 0 1px 0 color-mix(in oklab,#fff 60%,transparent),inset 0 0 0 .5px color-mix(in oklab,var(--ink) 10%,transparent),0 10px 34px rgba(0,0,0,.14)}
.look-card{position:relative;z-index:4;margin-top:-92px;border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:14px}
.look-top{display:flex;gap:14px;align-items:flex-start}
.bottle-svg{width:34px;height:96px;flex:none}
.look-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.look-list{font:400 19px/1.35 var(--serif);margin:0}
.pillbtns{display:flex;gap:10px}
.pillbtns .btn{border-radius:999px;min-height:50px}

/* Where it's from */
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;padding-block:2px 6px}
.strip::-webkit-scrollbar{display:none}
.place{flex:none;width:232px;height:300px;border-radius:24px;overflow:hidden;position:relative;scroll-snap-align:start;color:#fff;text-align:left;background:var(--line)}
.place img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.place::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72))}
.place-in{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;display:flex;flex-direction:column;gap:4px}
.place-k{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.place-t{font:500 22px/1.1 var(--serif)}
.place-s{font:400 13px/1.35 var(--sans);opacity:.9}
.sheet-photo{width:calc(100% + 2 * max(16px,env(safe-area-inset-left,0px)));margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-top:-26px;height:260px;object-fit:cover;display:block}
.fine{font:400 12px/1.4 var(--sans);color:var(--ink2)}
.fine a{color:inherit}

/* Label photos from your scans */
.labelthumb{width:40px;height:52px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 0 0 .5px color-mix(in oklab,var(--ink) 15%,transparent)}
.row.has-glass .labelthumb+.row-main{margin-left:-4px}

/* Floating tab bar */
.tabs.glassbar{background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding-block:0 calc(14px + env(safe-area-inset-bottom,0px))}
.glassbar .tabs-inner{display:flex;gap:10px;grid-template-columns:none}
.tabpill{flex:1;min-height:62px;border-radius:31px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:0 6px}
.tabpill .tab{min-height:50px;border-radius:25px}
.tabpill .tab[aria-current="page"]{background:color-mix(in oklab,var(--ink) 8%,transparent)}
.scanbtn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.scanbtn[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.scanbtn svg{width:28px;height:28px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

.timerbar{position:fixed;z-index:25;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:496px;margin-inline:auto;border-radius:22px;padding:10px 16px;display:flex;align-items:center;gap:12px}
.sheet-photo{width:100%;height:240px;margin:0;border-radius:18px}

/* ===== Wine page (modelled on a merchant's product page) ===== */
.wine-hero{--wine:var(--c-claret);position:relative;height:330px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:linear-gradient(180deg,transparent 70%,var(--bg) 100%),radial-gradient(ellipse 90% 80% at 50% 60%,color-mix(in oklab,var(--wine) 85%,#000) 0 22%,var(--wine) 42%,color-mix(in oklab,var(--wine) 45%,var(--bg)) 72%,var(--bg) 100%)}
.wine-hero img.ph{position:absolute;inset:0 0 auto;width:100%;height:62%;object-fit:cover;opacity:.55;-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent);mask-image:linear-gradient(180deg,#000 30%,transparent)}
.wine-hero .bottle-svg{position:relative;z-index:2;width:78px;height:220px;margin-bottom:22px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.wine-hero img.label{position:relative;z-index:2;height:230px;max-width:70%;object-fit:contain;border-radius:10px;margin-bottom:18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.backbtn{position:absolute;z-index:5;top:10px;left:max(12px,env(safe-area-inset-left,0px));width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.backbtn svg{width:18px;height:18px}
.savebtn{position:absolute;z-index:5;top:10px;right:max(12px,env(safe-area-inset-right,0px));height:40px;border-radius:20px;padding:0 14px;display:flex;align-items:center;gap:6px;font:600 14px var(--sans);color:var(--ink)}
.savebtn svg{width:16px;height:16px}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 6px;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.crumbs button{color:inherit;min-height:28px;letter-spacing:inherit;text-transform:inherit;font:inherit}
.crumbs span[aria-hidden]{opacity:.5}
.wname{font:500 28px/1.15 var(--serif);letter-spacing:-.01em;margin:2px 0 0;text-wrap:balance}
.wby{font:italic 400 18px/1.35 var(--serif);color:var(--ink2);margin:0}
.wby button{color:var(--accent);font:inherit}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 13px var(--sans);padding:5px 11px;border-radius:999px;background:color-mix(in oklab,var(--ink) 6%,transparent)}
.mat{display:flex;flex-direction:column;gap:8px}
.mat-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mat-h b{font:600 16px var(--sans)}
.mat-h span{font:400 13px var(--mono);color:var(--ink2)}
.tl{position:relative;height:30px;margin-top:14px}
.tl .rail{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:color-mix(in oklab,var(--ink) 10%,transparent)}
.tl .win{position:absolute;top:7px;height:8px;border-radius:4px;background:var(--accent)}
.tl .win.alt{top:18px;height:4px;background:color-mix(in oklab,var(--accent) 45%,transparent)}
.tl .now{position:absolute;top:2px;width:2px;height:20px;background:var(--ink);border-radius:1px}
.tl .now::after{content:"Now";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font:500 10px var(--mono);color:var(--ink)}
.tl-y{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--ink2)}
.scores{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.scores::-webkit-scrollbar{display:none}
.score{flex:none;min-width:132px;max-width:180px;background:var(--cell);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.score .n{font:500 28px/1 var(--serif)}
.score .n small{font:400 14px var(--mono);color:var(--ink2);margin-left:2px}
.score .w{font:600 13px/1.25 var(--sans)}
.score .d{font:400 12px var(--mono);color:var(--ink2)}
.score.you{background:var(--accent);color:var(--on-accent)}
.score.you .n small,.score.you .d{color:inherit;opacity:.8}
.score.add{justify-content:center;align-items:center;color:var(--accent);font:600 14px var(--sans);border:1.5px dashed color-mix(in oklab,var(--accent) 40%,var(--line));background:transparent}
.note{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.note p{margin:0;font:400 16px/1.5 var(--serif)}
.note .who{font:500 12px/1.3 var(--sans);color:var(--ink2)}
.note .who a{color:inherit}
.facts{display:grid;grid-template-columns:auto 1fr;gap:0}
.facts dt,.facts dd{margin:0;padding:11px 16px;border-top:1px solid var(--line);font-size:15px}
.facts dt{color:var(--ink2)}
.facts dd{text-align:right;min-width:0;overflow-wrap:anywhere}
.facts dt:first-of-type,.facts dt:first-of-type+dd{border-top:0}
.food{font:italic 400 17px/1.45 var(--serif);margin:0;padding-inline:4px}
.rec-k{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.srcline{font:400 12px/1.5 var(--sans);color:var(--ink2);padding-inline:4px;margin:0}
.srcline a{color:inherit}
.sugg{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.search{display:flex;align-items:center;gap:8px;background:color-mix(in oklab,var(--ink) 7%,var(--bg));border-radius:12px;padding:0 12px;min-height:44px}
.search svg{width:18px;height:18px;color:var(--ink2);flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles .place{width:auto;height:180px;border-radius:18px}
.tiles .place-t{font-size:18px}
.grape-chip[data-tried="true"]::before{content:"●";color:var(--accent);margin-right:2px}
.tabpill.four{grid-template-columns:repeat(4,1fr)}
/* Launch: Claret pours into its own name */
.launch{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .45s var(--ease)}
.launch.out{opacity:0;pointer-events:none}
.launch-in{display:flex;align-items:center;gap:16px;transition:transform .6s var(--ease)}
.launch.out .launch-in{transform:scale(1.06)}
.launch-mark{width:52px;height:52px;opacity:0;transform:scale(.6);transition:opacity .35s var(--ease),transform .5s var(--spring)}
.launch.mark .launch-mark{opacity:1;transform:none}
.launch-word{width:210px;height:auto;overflow:visible}
.launch-ghost{fill:none;stroke:var(--ink);stroke-opacity:0;stroke-width:14;transition:stroke-opacity .25s var(--ease)}
.launch.go .launch-ghost{stroke-opacity:.32}
.photo-view{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;justify-content:center;animation:fade .25s var(--ease);
  padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.photo-view img{width:100%;max-height:70vh;object-fit:contain}
.pv-cap{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px max(20px,env(safe-area-inset-left,0px)) 6px;color:#fff}
.pv-t{font:500 24px/1.15 var(--serif)}
.pv-s{font:400 14px var(--sans);opacity:.7}
.pv-more{color:#fff;font:600 14px var(--sans);min-height:40px;padding:0 14px;border-radius:20px;background:rgba(255,255,255,.16);flex:none}
.pv-credit{margin:0;padding:4px max(20px,env(safe-area-inset-left,0px)) 24px;font:400 12px/1.4 var(--sans);color:rgba(255,255,255,.55)}
.pv-credit a{color:inherit}
/* Region lettering: each place's name drawn in a hand that belongs to it */
.logo-mark{display:block;background:#fff;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:left center;mask-position:left center;filter:drop-shadow(0 2px 14px rgba(0,0,0,.4))}
.logo-mark.card{width:min(86%,calc(72px * var(--ar)))}
.logo-mark.page{width:min(86%,340px,calc(130px * var(--ar)));margin:0 auto;-webkit-mask-position:center;mask-position:center}
.letter{display:inline-block;line-height:1.05;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35);overflow-wrap:normal;white-space:nowrap;padding-inline:.04em}
.letter-local{display:block;font-size:15px;letter-spacing:.08em;opacity:.82;margin-top:6px;color:#fff}
.place .letter{font-size:var(--ls,34px);text-align:left}
.tiles .place .letter{font-size:calc(var(--ls,34px) * .78)}
/* Region page, laid out like an artist page */
#v-place{padding-top:0}
.ph{--tone:#2C2426;position:relative;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden;background:var(--tone)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 22%,transparent 42%,color-mix(in oklab,var(--tone) 70%,transparent) 72%,var(--tone) 100%)}
.ph-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 max(20px,env(safe-area-inset-left,0px)) 26px;text-align:center;width:100%}
.ph .letter{font-size:var(--lb,64px);text-align:center}
.ph-btns{display:flex;align-items:center;justify-content:center;gap:24px}
.cbtn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3)}
.cbtn svg{width:24px;height:24px}
.cbtn.big{width:78px;height:78px;background:#fff;color:var(--tone)}
.cbtn.big svg{width:34px;height:34px}
.cbtn[aria-pressed="true"]{color:#F2C14E}
.ph-below{--tone:#2C2426;background:var(--tone);color:#fff;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:22px;min-height:60vh}
.ph-below .sec-h h2{color:rgba(255,255,255,.7)}
.ph-below .group{background:rgba(255,255,255,.1)}

.ph-below .chev{color:#fff}
.feat{display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22);text-align:left;color:#fff;width:100%}
.feat .glass{width:64px;height:64px}
.feat .k{font:400 13px var(--sans);opacity:.75}
.feat .t{font:600 18px/1.25 var(--sans)}
.feat .s{font:400 14px/1.35 var(--sans);opacity:.75}
.feat .plus{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none;margin-left:auto}
.ph-blurb{font:400 18px/1.5 var(--serif);margin:0;color:rgba(255,255,255,.9)}
.ph-credit{font:400 12px/1.4 var(--sans);color:rgba(255,255,255,.5);margin:0}
.ph-credit a{color:inherit}
.ph-back{position:absolute;z-index:4;top:12px;left:max(14px,env(safe-area-inset-left,0px));width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.ph-back svg{width:20px;height:20px}
@media (min-width:560px){.ph,.ph-below{margin-inline:0}.ph{border-radius:32px 32px 0 0}}
/* Explore cards and the producer and grape pages */
.place.plain{background:var(--tone,#2C2426)}
.place.plain::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,rgba(255,255,255,.14),transparent 55%)}

.ph-name{font:500 clamp(34px,10vw,46px)/1.06 var(--serif);margin:0;text-align:center;text-wrap:balance;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.4)}

.mini-strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}

.chips.on-dark .chip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* Squarer system: crisp tiles, small radii, hairlines in place of soft shadows */
:root{--r:4px;--r2:6px}
.group,.empty,.stat,.score,.search,.seg,.pick,.shutter,.timerbar,.feat,.look-card,.place,.tiles .place,.mini-strip .place,.thumb,.sheet-photo,.wine-hero img.label,.labelthumb,.photo-view img,.note,.srcline{border-radius:var(--r)}
.btn,.pillbtns .btn,.chip,.gchip,.tags span,.verdict,.savebtn,.pv-more,.toast,.credit-old,.cbtn,.cbtn.big,.scanbtn,.backbtn,.ph-back,.feat .plus,.tabpill,.tabpill .tab,.thumb-x{border-radius:var(--r)}
.seg{border-radius:var(--r)} .seg button,.scale button{border-radius:3px}
.sheet{border-radius:var(--r2) var(--r2) 0 0}
.ph,.hero{border-radius:0}
@media (min-width:560px){.ph{border-radius:var(--r) var(--r) 0 0}}
.group{box-shadow:0 0 0 1px var(--line)}
.ph-below .group,.ph-below .feat{box-shadow:none}
.lgm{box-shadow:inset 0 0 0 .5px color-mix(in oklab,var(--ink) 16%,transparent),0 1px 3px rgba(0,0,0,.10)}
.chip{border-width:1px}
.tiles{gap:8px}
.tiles .place{height:176px}
.pick,.look-card{box-shadow:0 0 0 1px var(--line)}
.btn{min-height:48px}
.cbtn.big{border-radius:var(--r2)}

/* Cellar */
.look-name{font:500 20px/1.25 var(--serif);text-align:left;color:var(--ink)}
.qty{display:flex;align-items:center;gap:16px}
.qty button{width:44px;height:44px;border:1px solid var(--line);border-radius:var(--r);font-size:22px;line-height:1;color:var(--accent)}
.qty .mono{font-size:20px;min-width:28px;text-align:center}
.open-row{background:transparent}
.tag-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag-line span{font:500 12px var(--sans);padding:2px 8px;border-radius:var(--r);background:color-mix(in oklab,var(--ink) 7%,transparent);color:var(--ink2)}

.mark{position:absolute;top:10px;left:10px;z-index:3;font:600 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:var(--r);background:rgba(255,255,255,.92);color:#1D1517}

.mark.cellar{left:auto;right:10px;background:rgba(0,0,0,.6);color:#fff}
.how-many{font:400 14px/1.4 var(--sans);color:var(--ink2);margin:0}
.progress-line{font:400 14px var(--sans);color:var(--ink2);margin:0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips.scroll::-webkit-scrollbar{display:none}

/* Journey */
.stat-row.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .n small{font:400 14px var(--sans);color:var(--ink2);margin-left:3px}
.dots{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dots i.new{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.trail{position:relative;padding-left:30px}
.trail::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tmonth{font:600 20px/1.2 var(--serif);margin:10px 0 12px -30px}
.tstep{position:relative;padding:0 0 20px;display:flex;flex-direction:column;gap:3px}
.tdot{position:absolute;left:-30px;top:3px;width:21px;height:21px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 0 3px var(--bg)}
.tdot.new{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.tdot.open{background:transparent;border:2px dashed var(--accent);box-shadow:0 0 0 3px var(--bg)}
.tmeta{font:500 12px/1.3 var(--sans);color:var(--ink2);letter-spacing:.02em}
.trow{font:500 18px/1.25 var(--serif);text-align:left;color:var(--ink)}
.newtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.newtags button{font:600 12px var(--sans);padding:3px 8px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent)}
.profile-link{font:500 15px var(--sans);color:var(--accent);min-height:36px;align-self:flex-end}
.nudge{background:var(--accent-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.nudge p{margin:0;font:400 15px/1.4 var(--sans)}
.pbar{height:6px;background:color-mix(in oklab,var(--ink) 10%,transparent);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <header class="top">
    <button class="link" id="topBack" type="button" hidden style="margin-left:-4px">‹ Journey</button>
    <div class="moment"><h1 id="title">Scan</h1></div>
    <p class="sub mono" id="sub"></p>
  </header>

  <main>
    <section class="view" id="v-tonight" aria-label="Tonight">
      <div class="hero" id="hero">
        <img class="hero-img" id="heroImg" alt="" data-loading hidden>
        <div class="hero-wash" aria-hidden="true"></div>
        <span class="region-name" id="heroRegion"></span>
        <button class="credit" id="heroCredit" type="button" hidden></button>
        <button class="hero-date" id="momentBtn" type="button" aria-haspopup="dialog"><span id="heroWhen"></span></button>
        <div class="hero-in">
          <h1 class="hero-title" id="heroTitle"></h1>
          <p class="hero-why" id="heroWhy"></p>
          <div class="ctx-chips" id="ctxChips"></div>
        </div>
      </div>

      <article class="look-card lgm" id="pick" aria-live="polite"></article>

      <div class="sec" id="openNow" hidden></div>

      <div class="sec">
        <button class="btn" id="findBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Find bottles for this</button>
        <div id="bottles" class="sec" aria-live="polite"></div>
      </div>

      <div class="sec" id="placesSec">
        <div class="sec-h"><h2>Where it's from</h2></div>
        <div class="strip" id="places"></div>
      </div>

      <div class="sec">
        <div class="sec-h"><h2>Sideways</h2></div>
        <div class="group" id="alts"></div>
      </div>

      <div class="chips" id="limitsLine" aria-label="Your limits"></div>

      <div class="sec" id="recentSec" hidden>
        <div class="sec-h"><h2>Lately</h2><button class="link" type="button" data-go="log">See all</button></div>
        <div class="group" id="recent"></div>
      </div>
    </section>

    <section class="view" id="v-cellar" hidden aria-label="Cellar">
      <div id="cellarOut" class="sec" style="gap:20px"></div>
    </section>

    <section class="view" id="v-explore" hidden>
      <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input class="input" id="q" type="search" autocomplete="off" placeholder="Wines, producers, places, grapes"></label>
      <div id="exploreOut" class="sec" style="gap:22px"></div>
    </section>

    <section class="view" id="v-wine" hidden aria-label="Wine"></section>

    <section class="view" id="v-place" hidden aria-label="Place"></section>

    <section class="view" id="v-scan" hidden>
      <div class="seg" id="scanMode" role="radiogroup" aria-label="What are you scanning?">
        <button type="button" role="radio" data-m="label" aria-checked="true">Label</button>
        <button type="button" role="radio" data-m="compare" aria-checked="false">Compare</button>
        <button type="button" role="radio" data-m="list" aria-checked="false">Wine list</button>
      </div>
      <p class="foot" id="scanHint"></p>
      <div class="chips" id="gapsLine" hidden></div>
      <label class="shutter" id="shutter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.5-2h5.6l1.5 2h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
        <span id="shutterText">Take a photo of the label</span>
        <input id="photo" type="file" accept="image/*" capture="environment">
      </label>
      <div class="thumbs" id="thumbs"></div>
      <div class="group">
        <label class="row" for="venue"><span class="lab">Where</span><input class="input" id="venue" type="text" autocomplete="off" placeholder="Majestic Clapham, Noble Rot…"></label>
      </div>
      <div class="btns">
        <button class="btn" id="readBtn" type="button" disabled>Read it</button>
        <button class="btn ghost" id="stopBtn" type="button" hidden>Stop</button>
      </div>
      <div id="scanOut" class="sec" aria-live="polite"></div>
    </section>

    <section class="view" id="v-log" hidden aria-label="Journey">
      <div id="journeyTop" class="sec" style="gap:18px"></div>
      <div id="journeyBody" class="sec" style="gap:18px"></div>
    </section>

    <section class="view" id="v-you" hidden>
      <div class="stat-row" id="stats"></div>
      <div class="sec" id="palateSec"></div>

      <div class="sec">
        <div class="sec-h"><h2>Hard limits</h2></div>
        <div class="group">
          <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
            <span class="lab">Colours I'll drink</span>
            <div class="chips" id="limColours"></div>
          </div>
          <label class="row" for="limBottle"><span class="lab">Max a bottle</span><span class="row-main"></span><span class="mono">£</span><input class="input mono" id="limBottle" type="number" inputmode="decimal" min="0" step="1" placeholder="Any"></label>
          <label class="row" for="limGlass"><span class="lab">Max a glass</span><span class="row-main"></span><span class="mono">£</span><input class="input mono" id="limGlass" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Any"></label>
          <label class="row" for="limAbv"><span class="lab">Max ABV</span><span class="row-main"></span><input class="input mono" id="limAbv" type="number" inputmode="decimal" min="0" max="25" step="0.5" placeholder="Any"><span class="mono">%</span></label>
          <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
            <span class="lab">Not from</span>
            <div class="chips" id="limCountries"></div>
          </div>
          <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
            <label class="lab" for="limGrapeIn">Grapes I avoid</label>
            <div class="chips" id="limGrapes"></div>
            <input class="input" id="limGrapeIn" type="text" autocomplete="off" placeholder="Type a grape and press return">
          </div>
        </div>
        <p class="foot">Claret never suggests anything that breaks these. Each suggestion is checked against them before you see it.</p>
      </div>

      <div class="sec">
        <div class="sec-h"><h2>Discovery</h2></div>
        <div class="group">
          <div class="row" style="flex-direction:column;align-items:stretch;gap:0">
            <div style="display:flex;justify-content:space-between"><span class="lab">Safe bets</span><span class="lab" style="text-align:right">Surprise me</span></div>
            <input type="range" id="explore" min="0" max="1" step="0.1" aria-label="How adventurous suggestions should be">
          </div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-h"><h2>Settings</h2></div>
        <div class="group">
          <label class="row" for="city"><span class="lab">Home</span><input class="input" id="city" type="text" style="text-align:right" autocomplete="off" placeholder="London"></label>
          <label class="row" for="tonightFrom"><span class="lab">Tonight from</span><span class="row-main"></span><input class="input mono" id="tonightFrom" type="time" style="width:auto"></label>
          <label class="row" for="nightcapFrom"><span class="lab">Nightcap from</span><span class="row-main"></span><input class="input mono" id="nightcapFrom" type="time" style="width:auto"></label>
        </div>
      </div>

      <div class="sec">
        <div class="sec-h"><h2>Your data</h2></div>
        <div class="group">
          <button class="row" type="button" id="exportBtn"><span class="row-main"><span class="row-t" style="font-family:var(--sans);font-size:17px">Export everything</span><span class="row-s">One JSON file: profile, wines, every tasting and sighting</span></span></button>
        </div>
        <p class="foot" id="syncNote"></p>
        <textarea class="input" id="exportOut" hidden readonly aria-label="Exported data" style="background:var(--cell);border-radius:14px;padding:12px;font:12px var(--mono)"></textarea>
      </div>
    </section>
  </main>

  <nav class="tabs glassbar" aria-label="Sections">
    <div class="tabs-inner">
      <div class="tabpill lgm four">
        <button class="tab" type="button" data-tab="tonight" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l-.4 5.2a4.6 4.6 0 0 1-9.2 0z"/><path d="M12 13v7M8.5 21h7"/><path d="M7.3 7h9.4"/></svg><span id="tabMoment">Tonight</span></button>
        <button class="tab" type="button" data-tab="cellar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10a8 8 0 0 1 16 0v10"/><path d="M3 20h18"/><path d="M9 20v-6h6v6"/></svg>Cellar</button>
        <button class="tab" type="button" data-tab="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Explore</button>
        <button class="tab" type="button" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18c4-9 7 2 11-6 2-4 4-6 7-7"/><circle cx="5" cy="18" r="1.4" fill="currentColor"/><circle cx="14" cy="12" r="1.4" fill="currentColor"/><circle cx="21" cy="5" r="1.4" fill="currentColor"/></svg>Journey</button>
      </div>
      <button class="scanbtn lgm tab" type="button" data-tab="scan" aria-label="Scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M10 8h4v8h-4z"/></svg></button>
    </div>
  </nav>

  <div class="sheet-wrap" id="sheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grabber" aria-hidden="true"></div>
      <div id="sheetBody" style="display:flex;flex-direction:column;gap:18px"></div>
    </div>
  </div>
  <div class="timerbar lgm" id="timerBar" hidden><span class="glass" style="--c:var(--c-ruby);width:28px;height:28px" aria-hidden="true"></span><span class="row-main"><span class="row-t" id="timerText" style="font-family:var(--sans);font-size:15px;font-weight:600"></span></span><span class="mono" id="timerLeft" style="font-size:20px;font-weight:500;color:var(--accent)"></span><button class="link" type="button" id="timerStop" style="min-height:36px">Done</button></div>

  const tg = top(P.grape, gName); if (tg.length) lines.push('Best-rated grapes: ' + tg.join(', '));
  const tc = top(P.country, cName); if (tc.length) lines.push('Best-rated countries: ' + tc.join(', '));
  const lg = low(P.grape, gName); if (lg.length) lines.push('Rated low: ' + lg.join(', '));

}

    const add = (k, label) => { const v = s.w[k] || 0; if (v) { score += v; if (v >= 2 && label) why.push(label); } };
    add(c.moment, { today: 'easy for the daytime', lunch: 'made for a long lunch', tonight: 'right for the evening', nightcap: 'a proper nightcap' }[c.moment]);
    add(c.season, 'suits ' + c.season);

  const s = season(d);
  $('#sub').textContent = [d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }), pad(d.getHours()) + ':' + pad(d.getMinutes()), s[0].toUpperCase() + s.slice(1), Store.profile.home.city].filter(Boolean).join(' · ');
}
function go(tab, focusSel) {
  S.tab = tab;
  for (const v of ['tonight', 'cellar', 'explore', 'wine', 'place', 'scan', 'log', 'you']) $('#v-' + v).hidden = v !== tab;
  if (tab !== 'wine' && tab !== 'place') S.nav = [];
  const lit = tab === 'wine' || tab === 'place' ? S.base : tab === 'you' ? 'log' : tab;
  $$('.tab').forEach(b => { if (b.dataset.tab === lit) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  renderAll();
  window.scrollTo(0, 0);
  if (focusSel) setTimeout(() => { const n = $(focusSel); n && n.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 50);
}
function renderAll() {
  renderHeader();
  if (S.tab === 'tonight') renderTonight();
  if (S.tab === 'scan') renderScan();
  if (S.tab === 'log') renderJourney();
  if (S.tab === 'cellar') renderCellar();
  if (S.tab === 'explore') renderExplore();
  if (S.tab === 'wine') renderWine();
  if (S.tab === 'place') renderPlace();
  if (S.tab === 'you') renderYou();
}
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

$$('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });
$('#momentBtn').addEventListener('click', () => {
  const auto = autoMoment();
  openSheet('What are we drinking for?', [el('div', { class: 'group' }, ...Object.entries(MOMENT_NAME).map(([k, n]) =>
    el('button', { class: 'row', type: 'button', onclick: () => { S.momentOverride = k === auto ? null : k; S.pick = null; $('#bottles').replaceChildren(); closeSheet(); renderAll(); } },
      el('span', { class: 'row-main' }, el('span', { class: 'row-t', text: n }), k === auto ? el('span', { class: 'row-s', text: 'Right now' }) : null),
      moment() === k ? el('span', { class: 'row-end', style: 'color:var(--accent)', text: '✓' }) : null))),
  el('p', { class: 'foot', text: 'Claret switches from Today to Tonight at ' + Store.profile.moments.tonightFrom + '. Change the times in You.' })]);
});
$('#findBtn').addEventListener('click', findBottles);
$('#topBack').addEventListener('click', () => go('log'));
$('#timerStop').addEventListener('click', () => Timer.stop());
$('#scanMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.scan.mode = b.dataset.m; $('#photo').toggleAttribute('multiple', b.dataset.m !== 'label'); $('#scanOut').replaceChildren(); renderScan(); });
$('#photo').addEventListener('change', e => { for (const f of e.target.files) S.scan.files.push({ blob: f }); e.target.value = ''; $('#scanOut').replaceChildren(); renderScan(); });
$('#readBtn').addEventListener('click', readScan);
let qT = null; $('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(renderExplore, 150); });
$('#stopBtn').addEventListener('click', () => { S.scan.ctl && S.scan.ctl.abort(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderHeader(); });
let lastMoment = moment();
setInterval(() => { if (!document.hidden) { renderHeader(); if (S.tab === 'tonight' && moment() !== lastMoment) { lastMoment = moment(); S.pick = null; renderTonight(); } } }, 60000);

/* Launch: once a day, the word fills with claret like a glass being poured; tap to skip */
function launch() {
  const L = $('#launch');
  const today = new Date().toISOString().slice(0, 10);
  if (LS.get('claret.launch', '') === today || document.visibilityState === 'hidden') return;
  LS.set('claret.launch', today);
  L.hidden = false;
  const wine = $('#lwWine');
  const X0 = 47, W = 5642, TOP = -1489, BOT = 23;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const surface = (level, amp, t) => {
    let d = 'M' + X0 + ' ' + (BOT + 60);
    for (let i = 0; i <= 28; i++) { const x = X0 + W * i / 28; d += ' L' + x.toFixed(0) + ' ' + (level + amp * Math.sin(i / 28 * Math.PI * 3 + t * 9)).toFixed(0); }
    return d + ' L' + (X0 + W) + ' ' + (BOT + 60) + 'Z';
  };
  let done = false;
  const finish = () => { if (done) return; done = true; wine.setAttribute('d', surface(TOP - 120, 0, 0)); L.classList.add('mark'); setTimeout(() => L.classList.add('out'), 260); setTimeout(() => { L.hidden = true; }, 760); };
  L.addEventListener('click', finish, { once: true });
  if (reduced) { wine.setAttribute('d', surface(TOP - 120, 0, 0)); L.classList.add('go', 'mark'); setTimeout(finish, 500); return; }
  let start = null; const dur = 1100;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    if (done) return;
    if (start == null) { start = now + 160; L.classList.add('go'); }
    const t = Math.min(1, Math.max(0, (now - start) / dur));
    const level = BOT + 40 - (BOT - TOP + 160) * ease(t);
    const amp = 70 * (1 - t) * (t > 0 ? 1 : 0);
    wine.setAttribute('d', surface(level, amp, now / 1000));
    if (t < 1) requestAnimationFrame(step);
    else { L.classList.add('mark'); setTimeout(() => L.classList.add('out'), 400); setTimeout(() => { done = true; L.hidden = true; }, 900); }
  };
  wine.setAttribute('d', surface(BOT + 40, 0, 0));
  // begin after the first render has painted, so the pour never jumps ahead
  setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(step)), 0);
}
launch();

/* Boot: render from this device at once, then connect sync */
Store.loadLocal();
function seedCatalogue() { for (const n of CATALOGUE) if (!Store.nodes.has(n.id)) Store.nodes.set(n.id, structuredClone(n)); }
seedCatalogue();
canonProducers();
for (const n of Store.nodes.values()) indexAlias(n.id, [n.name, ...(n.aliases || [])]);
renderAll();
Timer.tick();
{ const _connect = Store.connect; Store.connect = async function () { const r = await _connect.apply(this, arguments); if (canonProducers()) renderAll(); return r; }; }
Store.connect();
</script>
